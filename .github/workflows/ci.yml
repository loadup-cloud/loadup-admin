name: Admin CI

on:
  push:
    branches: [main, develop, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  HUSKY: '0'

jobs:
  verify:
    name: Admin Quality, Tests and Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true
      - name: Install locked dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check
      - name: Check styles
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm style:check
      - name: Check application and package types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - name: Test request package
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @vea/request test
      - name: Test hooks package
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @vea/hooks test
      - name: Build admin
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build:admin
      - name: Upload built admin
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7 # v7
        with:
          name: admin-dist
          path: apps/admin/dist*/
          retention-days: 7
          if-no-files-found: ignore
